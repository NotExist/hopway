name: Build debug APK

# 只在手動觸發時建置(Actions 頁面 Run workflow,或 gh workflow run build-debug.yml)
on: workflow_dispatch

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup

      - name: Build metadata
        run: |
          # versionCode、顯示用建置時間、檔名時間戳都取自同一個時間點
          NOW=$(date -u +%s)
          STAMP=$(TZ=Asia/Taipei date -d "@$NOW" +%Y%m%d-%H%M)
          {
            echo "VERSION_CODE=$(( NOW / 60 ))"                                   # 分鐘級 Unix timestamp
            echo "BUILD_TIME=$(TZ=Asia/Taipei date -d "@$NOW" '+%Y-%m-%d %H:%M') (UTC+8)"
            echo "BUILD_COMMIT=${GITHUB_SHA::7}"
            echo "APK_NAME=SSHTunnelVPN-0.1.0-debug-${STAMP}-${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"

      # 固定 debug 金鑰:簽章不變才能覆蓋安裝、保留 App 資料(伺服器設定等)
      - name: Debug signing key
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DEBUG_KEYSTORE_BASE64" ]; then
            echo "::error::secret DEBUG_KEYSTORE_BASE64 is missing"; exit 1
          fi
          echo "$DEBUG_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/debug.keystore"
          echo "DEBUG_KEYSTORE=$RUNNER_TEMP/debug.keystore" >> "$GITHUB_ENV"

      - name: Build
        run: |
          ./gradlew --stacktrace -PversionCode="$VERSION_CODE" -PbuildTime="$BUILD_TIME" -PbuildCommit="$BUILD_COMMIT" :app:assembleDebug
          mkdir -p dist
          cp app/build/outputs/apk/debug/*.apk "dist/${APK_NAME}.apk"

      # 確認 APK 真的用固定金鑰簽章(比對公鑰 modulus),否則覆蓋安裝會失敗
      - name: Verify signature
        run: |
          keytool -exportcert -keystore "$DEBUG_KEYSTORE" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/cert.der"
          openssl x509 -inform der -in "$RUNNER_TEMP/cert.der" -noout -modulus | cut -d= -f2 > "$RUNNER_TEMP/mod.hex"
          python3 - <<'PY'
          import glob, os, sys
          m = bytes.fromhex(open(os.environ["RUNNER_TEMP"] + "/mod.hex").read().strip())
          apk = open(glob.glob("dist/*.apk")[0], "rb").read()
          ok = m[64:128] in apk
          print("signed with fixed debug key:", ok)
          sys.exit(0 if ok else 1)
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APK_NAME }}
          path: dist/*.apk
          if-no-files-found: error
