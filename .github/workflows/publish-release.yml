name: Publish release

# 只在推 v* tag 時建置並發佈
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup

      - name: Version code + file name
        run: |
          # versionCode = 分鐘級 Unix timestamp:建置即遞增,與 workflow/run number 無關
          VERSION_CODE=$(( $(date -u +%s) / 60 ))
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          # 檔名:tag-變體-versionCode-建置時間(台灣時間)
          echo "APK_NAME=SSHTunnelVPN-${GITHUB_REF_NAME}-release-${VERSION_CODE}-$(TZ=Asia/Taipei date +%Y%m%d-%H%M)" >> "$GITHUB_ENV"

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::release keystore secrets are missing (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: |
          ./gradlew --stacktrace -PversionCode="$VERSION_CODE" :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/${APK_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
