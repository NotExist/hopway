name: Publish release

# 只在推 v* tag 時建置並發佈
on:
  push:
    tags: ["v*"]

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/android-setup

      - name: Build metadata
        run: |
          # versionCode、顯示用建置時間、檔名時間戳都取自同一個時間點
          NOW=$(date -u +%s)
          STAMP=$(TZ=Asia/Taipei date -d "@$NOW" +%Y%m%d-%H%M)
          {
            echo "VERSION_CODE=$(( NOW / 60 ))"                                   # 分鐘級 Unix timestamp
            echo "BUILD_TIME=$(TZ=Asia/Taipei date -d "@$NOW" '+%Y-%m-%d %H:%M') (UTC+8)"
            echo "BUILD_COMMIT=${GITHUB_SHA::7}"
            echo "APK_NAME=Hopway-${GITHUB_REF_NAME}-release-${STAMP}"
          } >> "$GITHUB_ENV"

      - name: Release signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::release keystore secrets are missing (KEYSTORE_BASE64 / KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD)"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release.jks
          printf 'storeFile=release.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" > keystore.properties

      - name: Build
        run: |
          ./gradlew --stacktrace -PversionCode="$VERSION_CODE" -PbuildTime="$BUILD_TIME" -PbuildCommit="$BUILD_COMMIT" :app:assembleRelease
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/${APK_NAME}.apk"

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*.apk
          generate_release_notes: true
